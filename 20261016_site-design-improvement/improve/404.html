<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 静かな資料館（モック）</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root { --bg:#f6f1ea; --bg-raise:#fdfaf5; --text:#2b2320; --text-sub:#6f625a; --accent:#7c1d24; --rule:rgba(43,35,32,.16); }
@media (prefers-color-scheme: dark) { :root { --bg:#191410; --bg-raise:#221b15; --text:#e8ddcd; --text-sub:#a8937a; --rule:rgba(232,221,205,.2); } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:"Hiragino Mincho ProN","Yu Mincho",serif; line-height:1.8; }
.masthead { padding:20px 24px; border-bottom:1px solid var(--rule); }
.masthead p { margin:0; letter-spacing:.12em; }
.masthead small { display:block; color:var(--text-sub); letter-spacing:.08em; margin-top:2px; }
main { max-width:640px; margin:0 auto; padding:64px 24px; text-align:center; }
h1 { font-size:1.4rem; font-weight:600; letter-spacing:.14em; margin:0 0 16px; }
p { color:var(--text-sub); margin:0 0 28px; }
a { display:inline-block; padding:10px 24px; border:1px solid var(--rule); border-radius:6px; color:var(--text); text-decoration:none; background:var(--bg-raise); }
a:hover, a:focus { color:var(--accent); }
</style>
</head>
<body>
<header class="masthead"><p>回廊の記録<small>非公式資料サイト・モック</small></p></header>
<main>
  <h1>この頁は架蔵に無い</h1>
  <p>指定された頁は見つかりません。移動または削除された可能性があります。</p>
  <a href="/">入口へ戻る</a>
</main>
</body>
</html>
