<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向C 人物一覧 — 根拠をたどる記録室（モック）</title>
<meta name="description" content="非公式・模擬データで作る資料サイトのモック。外部リクエストなしの静的構成。">
<meta property="og:title" content="方向C 人物一覧 — 根拠をたどる記録室（モック）">
<meta property="og:site_name" content="回廊の記録">
<meta property="og:type" content="website">
<meta property="og:description" content="非公式・模擬データで作る資料サイトのモック。外部リクエストなしの静的構成。">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/improve.css">
</head>
<body>
<noscript><p class="noscript-note">この面は JavaScript で出典データを組み立てて表示します。無効の場合は表や一覧の一部が空になります。</p></noscript>
<header class="masthead">
  <p class="site">回廊の記録<small>非公式資料サイト・モック／方向C</small></p>
  <nav aria-label="主ナビゲーション">
    <a href="compare.html">比較入口</a>
    <a href="chara-a.html">A</a>
    <a href="chara-b.html">B</a>
    <a href="chara-c.html" aria-current="page">C</a>
  </nav>
</header>

<main>
  <h1>人物一覧</h1>
  <p class="lead">各人物に「記録の状態」を付ける。検証状態・出演作品・出典の群名を
    一覧の段階で見せ、詳細を読む前に根拠の有無が分かる形にする。
    検証状態は出典の数ではなく照合結果（catalog.json の verify）で出す。</p>

  <section aria-label="検索と絞り込み">
    <input type="search" id="q" placeholder="名前・役割から引く" aria-label="人物を検索">
    <div class="chips" role="group" aria-label="所属で絞り込み" style="margin-top: var(--space-2);">
      <button class="chip" aria-pressed="true" data-aff="all">すべて（13）</button>
      <button class="chip" aria-pressed="false" data-aff="回廊聖堂">回廊聖堂（4）</button>
      <button class="chip" aria-pressed="false" data-aff="教団">教団（2）</button>
      <button class="chip" aria-pressed="false" data-aff="鐘楼">鐘楼（2）</button>
      <button class="chip" aria-pressed="false" data-aff="祝祭庁">祝祭庁（1）</button>
      <button class="chip" aria-pressed="false" data-aff="地下病院">地下病院（1）</button>
      <button class="chip" aria-pressed="false" data-aff="独立">独立（1）</button>
      <button class="chip" aria-pressed="false" data-aff="不明">不明（2）</button>
    </div>
    <p class="result-line" id="result-line" aria-live="polite"></p>
    <ul class="grid" id="grid" style="list-style:none; padding:0; margin:0;"></ul>
  </section></main>

<footer class="page-foot">モック（模擬データ）。方向C — 根拠をたどる記録室。出典欄の群名は sources.json、検証は catalog.json の照合結果。</footer>

<script src="js/chara-c.js"></script>
</body>
</html>
