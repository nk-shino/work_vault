<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>回廊の記録 — 表紙</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <!-- 読み込み幕（表紙のみ・noscript では非表示） -->
  <div class="curtain curtain--page" id="curtain-page" aria-hidden="true">
    <p class="curtain-title">回廊の記録</p>
    <p class="curtain-sub">ARCHIVE</p>
  </div>
  <noscript><style>.curtain--page { display: none; }</style></noscript>

  <header class="site-head">
    <a class="site-brand" href="index.html">回廊の記録</a>
    <nav class="site-crumbs" aria-label="現在地">
      <span class="here" aria-current="page">表紙</span>
    </nav>
  </header>

  <main class="page page--hero">
    <section class="hero">
      <p class="overline">ARCHIVE — 灯りと星の記録</p>

      <!-- ヒーロー見出し: 1文字リビール（幕が退き始めるのを待つ・data-wait） -->
      <h1 class="hero-title char-wrap" data-wait="550"><span class="char-target">灯りの渡り廊下</span></h1>

      <!-- リード文: 行マスク（GSAP SplitText・幕と見出しに続く） -->
      <p class="lead line-mask" data-wait="1150">大正十二年、渡り廊下に八基の灯りが掛けられた。朝と夕に点検の記録がつけられ、星の高さは夜ごと帳簿に写された。ここに、廊下を守った九名の名と歩みを収める。</p>

      <!-- 導線2本: 控えめhover（背景の色づき＋下線スイープ） -->
      <nav class="lead-nav" aria-label="案内">
        <a class="lead-nav-item u-tint" href="list.html">
          <span class="lead-nav-top">
            <span class="lead-nav-no">01</span>
            <span class="lead-nav-label">資料の一覧</span>
          </span>
          <span class="lead-nav-desc">九名の記録 — 役割と在任の年代</span>
        </a>
        <a class="lead-nav-item u-tint" href="detail.html">
          <span class="lead-nav-top">
            <span class="lead-nav-no">02</span>
            <span class="lead-nav-label">年代記</span>
          </span>
          <span class="lead-nav-desc">星読みの守 — 歩みと帳簿の抜粋</span>
        </a>
      </nav>
    </section>
  </main>

  <footer class="site-foot">
    <nav class="foot-nav" aria-label="ページ移動">
      <a class="u-grow" href="index.html" aria-current="page">表紙</a>
      <a class="u-grow" href="list.html">一覧</a>
      <a class="u-grow" href="detail.html">詳細 — 星読みの守</a>
    </nav>
    <p class="foot-note">方向性合意用モック（破棄前提）／人物・資料・年代はダミーで実在の記録と無関係／GSAP は CDN（jsDelivr・無料・未読時はフォールバック）</p>
  </footer>

  <!-- GSAP（行マスクのみで使用。読めなければ motion.js がフォールバックする） -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/SplitText.min.js"></script>
  <script src="motion.js"></script>
</body>
</html>
