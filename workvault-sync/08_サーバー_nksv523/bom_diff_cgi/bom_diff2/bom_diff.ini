# ***** bom_diff initials *****
# syntax: Place mandatory single space prior to value.("#" is recognized as comment line.)
# Specify the target DIRECTORY for BOSS I/F.
# Target DIRECTORY must be mounted on BOSS server folder.
# System periodically gets IFID139,142,146 from DIRECTORY.
# nksvasp23:172.30.64.143(for actual) / nksvasp43: 172.30.67.192(for test)
# See CIFS for Linux.
boss_org = /mnt/nksvasp23_SMT_RCV/
# boss_org=/mnt/nksvasp43_SMT_RCV/
#
# Specify local mysqlDB server host name or IP address.
db_source = 172.25.253.60
#
# Specify common mysqlDB server host name or IP address.
db2_source = nksv560.ad.nkc.co.jp
#
# Specify common mysqlDB server host name or IP address.
db3_source = nksv569.ad.nkc.co.jp
#
# Specify the EGproServer-Plan DSN by ODBC connection.
db_ODBCserver = EGPro
#
# Specify the EGproServer-MST DSN by ODBC connection.
db2_ODBCserver = EGPro_Mst
