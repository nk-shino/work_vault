[alembic]
script_location = %(here)s/migrations
# ASCII only: alembic reads this file with the system code page (cp932 on Japanese Windows).
# The database URL is decided in migrations/env.py, never written here.
prepend_sys_path = src
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
