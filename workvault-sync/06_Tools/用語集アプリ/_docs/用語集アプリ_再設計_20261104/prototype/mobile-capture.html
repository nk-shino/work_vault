<!doctype html>
<html lang="ja">
<head><meta charset="utf-8">
<title>375px キャプチャ（検証用）</title>
<style>
  html, body { margin: 0; background: #8a8d93; }
  /* headless の最小ウィンドウ幅（≈496px）のため、375px の iframe を
     真の 375px ビューポートとして撮影する経由ページ（成果物ではない） */
  iframe { width: 375px; height: 812px; border: 0; display: block; background: #191b1f; }
</style>
</head>
<body>
<iframe id="f" scrolling="no"></iframe>
<script>
  const src = new URLSearchParams(location.search).get('src');
  if (src) document.getElementById('f').src = src;
</script>
</body>
</html>
