[project]
name = "glossary-poc"
version = "0.0.1"
description = "社内用語集 PoC（Phase 0: オフライン・モックのみ）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sudachipy>=0.6.8",
    "sudachidict-core>=20240409",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
# 以下は Phase 0 では入れない。仕様確定後に必要になった側だけを入れる
litellm = ["openai>=1.30"]
local = ["sentence-transformers>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glossary = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: ruff は全角文字を幅2で数えるので、日本語の文字列やコメントがあるとすぐ超える。
# 行の長さは ruff format に任せ、lint では見ない
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["glossary"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["sudachipy.*", "openai.*", "sentence_transformers.*"]
ignore_missing_imports = true
