<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}社内用語集{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <!-- アイコン: Lucide (https://lucide.github.io, ISC License) の一部を使用 -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sr-only" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  </svg>
  <a class="skip" href="#main">本文へ移動</a>
  <header>
    <span class="brand"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-book"/></svg><strong>社内用語集</strong></span>
    <nav aria-label="メイン">
      <a href="/terms">用語一覧</a>
      <a href="/proposals">提案キュー{% if nav_pending %} <span class="nav-badge" title="未処理の提案の件数">{{ nav_pending }}</span>{% endif %}</a>
      <a href="/review">見直し</a>
      <a href="/new">用語を登録</a>
      <a href="/export.csv">CSV出力</a>
    </nav>
    <span class="notice">外部への接続はありません。入力した内容はこの PC の中だけで使われます。</span>
  </header>
  <main id="main" tabindex="-1">
    {% block main %}{% endblock %}
  </main>
  <div id="busy-status" class="busy" role="status" aria-live="polite" hidden>処理中…</div>
</body>
</html>
