<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}社内用語集{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <header>
    <span class="brand"><strong>社内用語集</strong></span>
    <nav aria-label="メイン">
      <a href="/terms">用語一覧</a>
      <a href="/proposals">提案キュー{% if nav_pending %} <span class="nav-badge" title="未処理の提案の件数">{{ nav_pending }}</span>{% endif %}</a>
      <a href="/review">見直し</a>
      <a href="/new">用語を登録</a>
      <a href="/export.csv">CSV出力</a>
    </nav>
    <span class="notice">外部接続なし・このPCの中だけで動作</span>
  </header>
  <main id="main" tabindex="-1">
    {% block main %}{% endblock %}
  </main>
  <div id="busy-status" class="busy" role="status" aria-live="polite" hidden>処理中…</div>
</body>
</html>
