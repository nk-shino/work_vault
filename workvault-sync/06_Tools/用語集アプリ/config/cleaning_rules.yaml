# メール本文から「用語の説明にならない部分」を落とすルール。
# コードを変えずに追加できるよう、ここに正規表現で並べる（Python の re 構文）。

# この行が現れたら、そこから下を全部捨てる（署名・転送元の引用ブロック）
cut_after:
  - name: 元メッセージ区切り
    pattern: '^\s*-{2,}\s*(Original Message|元のメッセージ)\s*-{2,}\s*$'
  - name: 署名区切り（-- ）
    pattern: '^--\s?$'
  - name: 署名の罫線
    pattern: '^\s*[━─＝=＿_]{5,}\s*$'
  - name: 英語の返信見出し
    pattern: '^On .+ wrote:\s*$'
  - name: 日本語の返信見出し
    pattern: '^.{1,60}(書きました|wrote)[:：]?\s*$'

# この行だけを捨てる
drop_lines:
  - name: 引用行
    pattern: '^\s*[>＞]'
  - name: 冒頭のあいさつ
    pattern: '^\s*(お疲れ(様|さま)です|いつも(大変)?お世話になっております|お世話になっております)[。．！!]*\s*$'
  - name: 結びのあいさつ
    pattern: '^\s*(以上(です)?|よろしくお願い(いた|致)?します|引き続きよろしくお願いします)[。．！!]*\s*$'
  - name: 宛名だけの行
    pattern: '^\s*\S{1,20}(さん|様|さま|殿|各位)[、,]?\s*$'

# 空行で区切った段落のうち、これに当たるものを丸ごと捨てる（免責文）
drop_paragraphs:
  - name: 免責文
    pattern: '(この|本)(メール|電子メール).{0,40}(機密|秘密|宛先|誤って|誤送信)'
  - name: 英語の免責文
    pattern: '(?i)confidential|intended (only )?for the'
