# 自動判定のしきい値。取り込み（python tasks.py import / propose）のたびに読む。
# 変えたら、次の取り込みから効く。すでに採用・保留したものには遡らない。
#
# 判定は3通り。
#   用例の追加 … 登録済みの語に、新しい用例を自動で足す。定義は変えない（人が直した定義を上書きしないため）
#   自動採用   … 新しい語を、LLM が書いた定義で確定まで進める。下の条件をすべて満たすときだけ
#   保留       … それ以外。提案キューに残し、保留の理由を付ける
#
# モック（LLM_BACKEND=mock）の定義文は中身が無いので、どの設定でも自動採用しない。

# 新しい語を自動採用するか（false にすると、新しい語はすべて保留になる）
auto_adopt_new_terms: true

# 用例がこの件数以上あること。1件だけだと、たまたまの使われ方か区別できない
min_evidences: 2

# 用例の出典（メール・資料）がこの数以上に分かれていること。同じ文書の繰り返しで数を稼がせない
min_sources: 2

# LLM 自身が付けた確からしさ（0〜1）がこれ以上であること
min_confidence: 0.7

# LLM が「用例が定義を支えている」と答えたものだけにする
require_supported: true

# 1つの語義に自動で足す用例の上限。定型文の繰り返しで用例欄が埋まらないように
max_evidences_per_sense: 10
