# マスキングのルール。上から順に適用する。コードを変えずに追加・並べ替えできる。
#
#   type: regex … pattern に当たった部分を token に置き換える。
#                 group を指定すると、その番号のグループだけを置き換える（敬称は残す等）
#                 exclude に並べた語は、当たっても置き換えない（「皆さん」の「皆」など）
#                 flags に MULTILINE などを並べると re のフラグとして付く
#                 keep_before / keep_after に当たる文脈（役割の語）があれば、当たっても置き換えない
#   type: pos   … SudachiPy の品詞が pos の並びで始まる形態素を置き換える（keep_* も使える）
#
# 順番に意味がある。シリアル番号は電話番号より先に消す。
# 後のルールが、前のルールの一部分だけを拾って崩すのを防ぐため。

# 伏せずに残すもの（2026-09-24 決定）。必要書類の場所が分からないと用語集として役に立たない。
# ルールを当てる前に退避するので、URL の中の数字が電話番号やシリアルとして崩されることもない
protect:
  - name: url
    pattern: 'https?://[^\s<>"「」（）()]+'
  - name: 共有フォルダのパス
    pattern: '\\\\[^\s<>"「」（）()]+'

# 役割と一緒に出る人名は残す（2026-09-24 決定）。誰に聞けばよいかという情報そのものなので。
# 名前の直後（敬称や「が」「の」をはさんでもよい）か、同じ行の直前に役割の語があるとき
role_after: &role_after '[ 　]?(?:さん|様|さま|氏)?[ 　]?(?:が|の|は)?[ 　]?(?:部長|課長|係長|主任|社長|担当|責任者|窓口|管理者)'
role_before: &role_before '(?:担当|責任者|窓口|管理者)(?:者)?[ 　]*[:：は]?[ 　]*$'

rules:
  - name: email
    type: regex
    pattern: '[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'
    token: '<EMAIL>'

  - name: serial
    type: regex
    # 「シリアル」「製造番号」「S/N」などの見出し付きと、英字と数字を両方含み2つ以上のハイフンでつないだ形
    # （数字だけの 000-1234-5678 は電話番号の側で拾う）
    pattern: '(?:(?:S/N|SN|シリアル(?:番号)?|製造番号)[:：\s]*[A-Za-z0-9][A-Za-z0-9\-]{3,})|\b(?=[A-Za-z0-9\-]*\d)(?=[A-Za-z0-9\-]*[A-Za-z])[A-Za-z0-9]{2,}(?:-[A-Za-z0-9]+){2,}\b'
    token: '<SERIAL>'

  - name: phone
    type: regex
    pattern: '(?<![\d\-])(?:\+81[\-\s]?|0)\d{1,4}[\-\s(（]?\d{1,4}[\-\s)）]?\d{3,4}(?![\d\-])'
    token: '<PHONE>'

  - name: money
    type: regex
    pattern: '[¥￥$]\s?[\d,，]+(?:\.\d+)?|[\d,，]+(?:\.\d+)?\s?(?:万|億|千)?円'
    token: '<MONEY>'

  - name: person_honorific
    type: regex
    # 敬称の直前にある漢字・かなを人名とみなす。取りこぼすより消しすぎる方を選ぶ
    # 「様」「氏」は後ろに漢字が続くと別の語（様々・氏名）なので敬称とみなさない
    # 名前は「漢字・カタカナの連なり」か「前にひらがなが続かない、ひらがなだけの名前」。
    # ひらがなを混ぜて数えると「窓口は霧島」のように助詞をまたいで前の語まで名前にしてしまう
    pattern: '([一-龥々ァ-ヶー]{1,8}|(?<![ぁ-ん])[ぁ-ん]{2,4})(?=\s?(?:さん|さま|殿|くん|部長|課長|係長|主任|社長|様(?![々一-龥])|氏(?![一-龥])))'
    group: 1
    exclude: ['皆', 'みな', 'お客', '各位', 'お得意', 'ご担当者', '担当者', 'ご担当']
    # 「仕様」「同様」「多様」のように、敬称ではなく語の一部として「様」が付くもの
    exclude_suffix: ['仕', '同', '模', '多', '異', '一', '有', '左', '斯']
    keep_before: *role_before
    keep_after: *role_after
    token: '<PERSON>'

  - name: person_self_intro
    type: regex
    # 業務メール冒頭の名乗り（「〇〇です。」だけの行）。敬称が付かないので上のルールでは拾えず、
    # 辞書が地名と判定する姓（霧島など）は下の品詞ルールもすり抜ける。
    # 見るのは本文の1行目だけ（\A）。あいさつは前処理で落ちているので、名乗りはここに来る。
    # 本文の途中の「新しい仕様です。」のような行まで名前扱いしないため。
    # 姓名の区切りは空白と全角空白だけ（\s だと改行をまたいで次の行まで名前にしてしまう）
    # 姓は漢字・カタカナだけ。ひらがなを許すと「窓口は霧島さんです」の1行を丸ごと名乗りと取り違える
    pattern: '\A[ 　]*([一-龥々ァ-ヶー]{1,8}(?:[ 　][一-龥々ぁ-んァ-ヶー]{1,8})?)(?=[ 　]*(?:です|と申します)[。．]?[ 　]*$)'
    group: 1
    flags: [MULTILINE]
    token: '<PERSON>'

  - name: person_pos
    type: pos
    pos: ['名詞', '固有名詞', '人名']
    keep_before: *role_before
    keep_after: *role_after
    token: '<PERSON>'
