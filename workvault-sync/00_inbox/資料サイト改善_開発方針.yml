project:
  name: "資料サイト（回廊の記録・非公式）改善"
  goal: "元サイトの構造を守りつつ、3方向A/B/Cの改善モックで比較検討する。本番実装は別判断"
  repo_state: "workspace は feature/tanaoroshi-spec-v2-20261013 ブランチ。mock は 99f80d1 でコミット済み（その後 CH-005 で改変あり）。improve は未コミット"

architecture:
  site_type: "静的HTML＋Vanilla JS＋fetch(JSON)。ビルド・フレームワーク・外部依存なし"
  directories:
    mock: "現行運用のコピー（比較の基準）。5頁＋js5本"
    improve: "改善3方向×5画面の16頁＋js10本＋improve.css"
    data: "mock/improve とも data/*.json（fixture）。mock と improve の data は同一内容"
    tools: "mock/tools と improve/tools は同一3本。片方だけ編集しない（diff で同一を確認）"
  directions:
    A: "帳面・静かな名簿。既存の絞り込みを守り最小改善"
    B: "索引・横断。行形式・検索・並び替え・関連列（既存データで組める接続のみ）"
    C: "記録・根拠。検証バッジ・照合内訳の開示・出典への導線"
  pages_per_direction: "HOME・目録棚(catalog)・人物一覧(chara)・出来事(events: B/C)・作品詳細(work: A/B/C)"
  data_flow: "data/*.json を fetch → 画面ごとの js で絞り込み・描画。入口は improve/compare.html"
  css_tokens:
    rule: "--rule* は構造の罫線、--border-accent は強調とアフォーダンス。役割分担であり置換しない"
    note: "手引き §7 参照。旧トークンを新系統へ置換する指示は誤り（99ノート）"

data_model:
  fixture:
    sources: "8群14項（confirmed 8 / supplement 2 / unverified 2 / none 2・no date 4項・URL未記録）"
    catalog: "50件（作品13・人物13・出来事9・用語15・verify 4状態）"
    characters: "13人（c011 は出演0作・image は全員空）"
    others: "works 13作・glossary 15・history 9（sourceIds 9/9 実在）・series 2群"
  verify_states: "confirmed / supplement / unverified / none。正式な定義文書は無し（画面文面が仮定義）"
  matching_algorithm:
    implemented_in: "tools/make-catalog.js の main()・表示側は improve/js/catalog-c.js traceFor が同一照合を再現"
    target: "出来事のみ（他種別は自動照合の対象外）"
    normalization: "norm(s) = 「」を除去して trim。core = 題から末尾の(公開|発売)を除去"
    rule: "claims.find(date !== 'no date' && norm(label).includes(core)) を先に当て、無ければ claims.find(norm(label).includes(core))"
    measured_result: "出来事9件中 E-005→s03-001 の1件のみ当たる。no date 4項は label が題核を含まないため当たらない"
    pitfall: "no date が落ちる直接の理由は日付の欠如ではなく label の不一致（第2パスは no date も対象）"

requirements:
  functional:
    - "検索・絞り込み・並び替え・0件表示（恒常0件文言を区別）・戻し（reset）"
    - "home-b から catalog-b へ検索語を受け渡す（?q= を URLSearchParams で受け、value 代入で設定）"
    - "catalog-c は検証バッジ押下で照合内訳を開閉（openSet 管理）"
    - "関連列は実在する参照（works.characters / glossary.workId / history.workId）のみで組む"
  nonfunctional:
    - "外部リクエスト禁止。fetch は同梱 data の相対パスのみ・favicon は data:,・CSS の url()/@import 無し"
    - "XSS 対策: innerHTML へ渡すデータは必ず esc()/text() 経由。件数行は textContent。属性は二重引用符"
    - "インラインハンドラ禁止（addEventListener に統一）・秘匿情報をコードと文書に入れない"
    - "a11y: aria-pressed / aria-expanded / aria-live を維持。ダークモード・390px 幅で崩さない"
    - "データ欠損時は catch で「データを読み込めない」を表示し 0件と区別する（CH-005 で導入）"

development_policy:
  workflow:
    - "着手前に reading_map の1〜3を読む。数値・状態の根拠は一次資料で確認する"
    - "変更は小さく分け、検証を通してから報告する。報告前に実行ログを書く"
    - "tools は mock/improve の2部を同一に保つ。編集後は diff -q で確認する"
  verification_commands:
    syntax: "node --check <js>（全 js 対象）"
    catalog_check: "node tools/make-catalog.js --check（期待: 50件・unverified 49 / confirmed 1・元データ一致）"
    audit: "node tools/fixture-audit.js（空値・null 45件を棚卸し）"
    boundary: "node tools/fixture-boundary-test.js（期待: 8/8 PASS・エスケープの境界試験）"
    browser: "python -m http.server を mock/improve それぞれで起動し全頁 HTTP200・console error 0・pageerror 0。検証後はサーバーを PID 指定で停止"
  prohibitions:
    - "workspace への commit/push はユーザー承認なしで実施しない"
    - "vault-sync は scripts/vault-sync.ps1 の skill 手順に従い、実行後の git ls-files 検証を省略しない"
    - "force-push・100MB超ファイル（自動はんだ不良入力.zip / NPM-DGS.PDF）の履歴再登録をしない"
    - "リポジトリの public 化をしない（98_Pass を含むため Private 維持）"
  recording_rules:
    run_log: "実行ログは vault://00_site-devlops/03_共通と運用/00_実行ログ/実行ログ_YYYYMMDD.md。指示1件＝エントリ1件（依頼・実施・成果物・状態）"
    change_log: "コード・文書の変更は 02ノートへ CH-xxx で起票（前後・根拠・検証・承認状態を書く）"
    artifact_log: "成果物の追加は vault://_system/decision-log.md へ1行"
    before_report: "完了報告の前に実行ログの記載を確認する（forced-logging）"
  writing_style:
    rule: "管理文書は比喩・日常語を避け、文長のリズムを揃えすぎない。詳細は deai-writing スキルと vault://01_Templates/プロンプト/DeAIプロンプト.md"

