; ***** ラベル発行アプリ設定ファイル *****
;
; 2016/09/01 新規作成

; ----- システム設定 -----
[SYSTEM]

; システム名称
SysName=[EGPro] 生産総合管理システム

; ユーザ名
UserName=日本光電富岡株式会社

; 著作権
ProductionName=Copyright(C) 2016 Panasonic FS Engineering Co., Ltd.

; 特記事項
Note=""

; ----- データベース設定 -----
[DATABASE]

; SQLServerサーバー名
SqlServerDataSource=EGPROSRV1

; SQLServerデータベース名
SqlServerDbNameMST=EGProKOHDEN-MST
SqlServerDbNameWarehouse=EGProKOHDEN-Warehouse

; 認証方式(0:WindowsUser 1:SQLServer)
Authentication=1

; ログインユーザ
LoginUser=sqluser

; ログインパスワード
Password=Pfseg001

; コマンドタイムアウト値(秒)
CommandTimeoutSec=0

; ----- ログ設定 -----
[LOG]

; 保存場所(ディレクトリ)
SaveDir=C:\EGPro-KOHDEN\Client\EGProLabelOutPut\Log

; 保存日数(日)
SaveDays=14

; デバックモード(0:通常 1:デバック)
DebugMode=1

; ----- アプリケーション設定 -----
[APLPARAMETER]

; 警告出力抽出レコード件数
WarningRecordCount=1000000

; ロケーション設定(ラベル発行)
LocationSettingLabelOut=1

; 分割機能(0:通常 1:ライン用)
BunkatsuFunction=0

; ----- 場所 -----
[PLACE]

; 原紙ファイル格納場所
TemplateFileDir=C:\EGPro-KOHDEN\Client\EGProLabelOutPut\原紙

; 出力ファイル保存場所
OutDir=C:\EGPro-KOHDEN\Client\EGProLabelOutPut\Out

; ----- ラベル設定 -----
[LABEL]

; ラベルフォーマットファイル
LabelFormatFile=C:\EGPro-KOHDEN\Client\EGProLabelOutPut\Label\KOHDEN-LBL-LabelFormat01.lbx

; 発行間隔（秒）
IssueInterval=5
