<main>
  <h1>人物</h1>
  <p class="lead">13人。肖像は準備中のあいだ、題箋で代用する（絵が入った日は同じ枠へ入る）。縦横比は 3:4 に固定。</p>

  <section aria-labelledby="chip-head">
    <h2 id="chip-head" class="visually-hidden">絞り込み</h2>
    <div class="chips" role="group" aria-label="所属で絞り込み">
      <button class="chip" aria-pressed="true" data-aff="all">すべて（13）</button>
      <button class="chip" aria-pressed="false" data-aff="回廊聖堂">回廊聖堂（4）</button>
      <button class="chip" aria-pressed="false" data-aff="教団">教団（2）</button>

      <button class="chip" aria-pressed="false" data-aff="祝祭庁">祝祭庁（1）</button>
      <button class="chip" aria-pressed="false" data-aff="地下病院">地下病院（1）</button>
      <button class="chip" aria-pressed="false" data-aff="独立">独立（1）</button>
      <button class="chip" aria-pressed="false" data-aff="不明">不明（2）</button>
    </div>
    <p class="result-line" id="result-line" aria-live="polite">13人を表示中。</p>
    <ul class="grid" id="grid" style="list-style:none; padding:0; margin:0;"></ul>
  </section>
