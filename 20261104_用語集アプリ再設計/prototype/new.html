<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/motion.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="new">

<header>
  <a class="brand" href="index.html">社内用語集</a>
  <nav aria-label="メイン">
    <a href="index.html">用語一覧</a>
    <a href="queue.html">提案キュー<span class="nav-badge num" aria-label="未処理の提案 7 件">7</span></a>
    <a href="review.html">見直し<span class="nav-badge num" aria-label="評価待ちの語義 11 件">11</span></a>
    <a href="history.html">履歴</a>
  </nav>
  <a href="#" id="open-palette" class="tool-link" hidden role="button">語を探す<kbd>Ctrl+K</kbd></a>
  <span class="notice num">確認済み 2026-11-04 08:40</span>
</header>

<main id="main">
  <p class="crumbs"><a href="index.html">用語一覧</a> › 用語を登録</p>
  <h1>用語を登録</h1>
  <p class="hint">登録は 1 分で終わる分量です。定義はあとから編集でき、そのたびに版が残ります。語義の追加は登録後の詳細画面から行えます。</p>

  <!-- FR-016: 保存の結果は一覧に戻ったとき、帯で示す（ここではデモ表示） -->
  <p id="new-band" class="band success" role="status" aria-live="polite" hidden></p>

  <form id="term-form" class="edit" action="#" method="post">
    <label>見出し語 <span class="label-note">（必須）</span>
      <input type="text" name="headword" value="ほうき便（北棟）" required>
    </label>
    <label>読み <span class="label-note">（ひらがな）</span>
      <input type="text" name="reading" value="ほうきびん">
    </label>

    <!-- FR-019: 読みが既存語と一致したら、登録の前に知らせる -->
    <div class="reading-warn" role="status">
      読み「ほうきびん」は既存の見出し語 <a href="index.html">ほうき便</a>（2026-10-22 登録）と同じです。同じ物を指すなら関連語の「同義」で結び、別の物なら読みか見出し語を見直してください。
    </div>

    <label>英語表記
      <input type="text" name="english" placeholder="例: north broom mail">
    </label>
    <label>略語
      <input type="text" name="abbr" placeholder="例: NBM">
    </label>
    <label>定義 <span class="label-note">（60 字前後。辞書の本文は明朝で組みます）</span>
      <textarea name="definition" rows="3" placeholder="例: 北棟の見える範囲だけで集配するほうき便。雨の日はスカイポスト経由に切り替わる。">北棟の見える範囲だけで集配するほうき便。雨の日はスカイポスト経由に切り替わる。</textarea>
    </label>
    <label>出典
      <select name="source">
        <option>手動（この画面で入力）</option>
        <option>mail（文書から自動抽出）</option>
      </select>
    </label>
    <label>用例 <span class="label-note">（辞書らしさは用例から育ちます。あれば貼ってください）</span>
      <textarea name="body" rows="3" placeholder="例: 北棟のほうき便は 10 時と 15 時の 2 回。"></textarea>
    </label>

    <p class="hint">関連語は登録後に詳細画面で結びます。混同注意（朱で注意を出す結び方）もそこから登録できます。</p>
    <button type="submit" class="primary">登録する<kbd>Ctrl+Enter</kbd></button>
    <a id="new-cancel" class="tool-link" href="index.html">キャンセル</a>
  </form>
</main>
</body>
</html>
